<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarePro — You're offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .icon { font-size: 4rem; margin-bottom: 1rem; }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #00B4A6; }
      p { font-size: 1rem; color: #6b7280; max-width: 320px; line-height: 1.6; }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 2rem;
        background: #00B4A6;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      Check your internet connection and try again. Your data is safe and
      will sync when you're back online.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
